.gallery{

  align-items:center;
  animation:slideUp 10s linear forwards;

  border-radius:10px;
}

  to{bottom:0;}

<!-- SCREEN 1 -->
<div id="screen1" class="screen">
  <h1>Are you ready?</h1>
  <button onclick="startExperience()">YES</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen hidden">
  <div class="flowers">
    <div class="petal" style="transform:rotate(0deg)"></div>
    <div class="petal" style="transform:rotate(60deg)"></div>
    <div class="petal" style="transform:rotate(120deg)"></div>
    <div class="petal" style="transform:rotate(180deg)"></div>
    <div class="petal" style="transform:rotate(240deg)"></div>
    <div class="petal" style="transform:rotate(300deg)"></div>
    <div class="center"></div>
  </div>
</div>
}
<!-- SCREEN 3 -->
<div id="screen3" class="screen hidden">
  <div class="gallery" id="gallery"></div>
</div>

<script>

/* Load 30 images automatically */
const gallery = document.getElementById("gallery");
for(let i=1;i<=30;i++){
  const img = document.createElement("img");
  img.src = i + ".jpg";
  gallery.appendChild(img);
}

function startExperience(){
  document.getElementById("screen1").classList.add("hidden");
  document.getElementById("screen2").classList.remove("hidden");

  // After 6 seconds go to screen 3
  setTimeout(()=>{
    document.getElementById("screen2").classList.add("hidden");
    document.getElementById("screen3").classList.remove("hidden");
  },6000);
}

</script>
